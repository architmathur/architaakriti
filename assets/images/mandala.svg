<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <g transform="translate(200, 200)" stroke="url(#gold)" fill="none" opacity="0.85">
    <!-- Center flower -->
    <circle r="8" fill="url(#gold)"/>
    <circle r="22" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle r="36" stroke-width="1.5"/>
    <circle r="52" stroke-width="1.2"/>
    <circle r="85" stroke-width="1"/>
    <circle r="120" stroke-width="1.5" stroke-dasharray="2,4"/>
    <circle r="155" stroke-width="1"/>
    <circle r="180" stroke-width="1.8"/>

    <!-- 12 Petals Layer 1 -->
    <g id="petals12">
      <!-- 12-fold symmetry -->
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" stroke-width="1.2" fill="none"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(30)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(60)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(90)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(120)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(150)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(180)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(210)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(240)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(270)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(300)" stroke-width="1.2"/>
      <path d="M0,-22 Q12,-35 0,-50 Q-12,-35 0,-22 Z" transform="rotate(330)" stroke-width="1.2"/>
    </g>

    <!-- Outer Petals Layer 2 -->
    <g id="petalsOuter">
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(30)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(30)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(60)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(60)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(90)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(90)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(120)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(120)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(150)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(150)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(180)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(180)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(210)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(210)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(240)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(240)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(270)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(270)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(300)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(300)"/>
      <path d="M0,-52 Q22,-75 0,-115 Q-22,-75 0,-52 Z" transform="rotate(330)" stroke-width="1.2"/>
      <circle cx="0" cy="-90" r="3" fill="url(#gold)" transform="rotate(330)"/>
    </g>

    <!-- Edge Scallops & Paisley Accents -->
    <g id="outerPoints">
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" stroke-width="1.5" fill="none"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(15)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(15)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(30)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(30)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(45)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(45)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(60)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(60)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(75)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(75)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(90)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(90)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(105)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(105)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(120)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(120)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(135)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(135)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(150)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(150)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(165)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(165)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(180)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(180)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(195)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(195)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(210)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(210)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(225)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(225)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(240)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(240)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(255)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(255)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(270)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(270)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(285)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(285)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(300)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(300)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(315)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(315)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(330)" stroke-width="1.5"/>
      <circle cx="0" cy="-185" r="2.5" fill="url(#gold)" transform="rotate(330)"/>
      <path d="M0,-155 C15,-165 15,-175 0,-185 C-15,-175 -15,-165 0,-155 Z" transform="rotate(345)" stroke-width="1.2"/>
      <circle cx="0" cy="-185" r="2" fill="url(#gold)" transform="rotate(345)"/>
    </g>
