<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5B131E" />
      <stop offset="60%" stop-color="#35080E" />
      <stop offset="100%" stop-color="#1A0307" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="750" rx="16" fill="url(#bgGrad)" />
  <!-- Ornate Inner Frame -->
  <rect x="25" y="25" width="550" height="700" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  <rect x="35" y="35" width="530" height="680" rx="8" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Corner Flourishes -->
  <g fill="none" stroke="url(#goldBorder)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M45,75 C45,55 55,45 75,45" />
    <circle cx="55" cy="55" r="3" fill="url(#goldBorder)" />
    <!-- Top-Right -->
    <path d="M555,75 C555,55 545,45 525,45" />
    <circle cx="545" cy="55" r="3" fill="url(#goldBorder)" />
    <!-- Bottom-Left -->
    <path d="M45,675 C45,695 55,705 75,705" />
    <circle cx="55" cy="695" r="3" fill="url(#goldBorder)" />
    <!-- Bottom-Right -->
    <path d="M555,675 C555,695 545,705 525,705" />
    <circle cx="545" cy="695" r="3" fill="url(#goldBorder)" />
  </g>

  <!-- Center Decorative Glow & Arch -->
  <circle cx="300" cy="330" r="160" fill="none" stroke="url(#goldBorder)" stroke-width="1" opacity="0.3" stroke-dasharray="4,6"/>
  <circle cx="300" cy="330" r="130" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="300" cy="330" r="95" fill="none" stroke="url(#goldBorder)" stroke-width="1" opacity="0.3"/>

  <!-- Monogram Crest -->
  <circle cx="300" cy="310" r="65" fill="#240508" stroke="url(#goldBorder)" stroke-width="2.5" />
  <circle cx="300" cy="310" r="58" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="3,3" />

  <text x="300" y="305" font-family="'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldBorder)" text-anchor="middle" letter-spacing="4">A &amp; A</text>
  <text x="300" y="332" font-family="'Cinzel', Georgia, serif" font-size="11" fill="url(#goldBorder)" text-anchor="middle" letter-spacing="3" opacity="0.9">ARCHIT &amp; AAKRITI</text>

  <!-- Arch silhouette illustration -->
  <path d="M220 480 C220 430 250 400 300 380 C350 400 380 430 380 480 L380 540 L220 540 Z" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.7"/>

  <!-- Subtitle Text -->
  <text x="300" y="580" font-family="'Cinzel', Georgia, serif" font-size="15" fill="url(#goldBorder)" text-anchor="middle" letter-spacing="4">THE ROYAL WEDDING</text>
  <text x="300" y="610" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EADBC8" text-anchor="middle" letter-spacing="2" opacity="0.8">CELEBRATING AN ETERNAL BOND</text>
</svg>
