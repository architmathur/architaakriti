<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4D121B" />
      <stop offset="70%" stop-color="#2B070D" />
      <stop offset="100%" stop-color="#180306" />
    </radialGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="50%" stop-color="#FCF6BA" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#cardBg)" />
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="url(#cardGold)" stroke-width="1.5" rx="8"/>
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="url(#cardGold)" stroke-width="0.8" stroke-dasharray="4,4" rx="6"/>
  
  <!-- Subtle Mandala circle -->
  <circle cx="250" cy="220" r="90" fill="none" stroke="url(#cardGold)" stroke-width="1" opacity="0.2" stroke-dasharray="3,5"/>
  <circle cx="250" cy="220" r="60" fill="none" stroke="url(#cardGold)" stroke-width="1.2" opacity="0.25"/>
  
  <!-- Center icon (Heart & Rings) -->
  <path d="M250 200 C240 180 215 180 215 205 C215 225 250 250 250 250 C250 250 285 225 285 205 C285 180 260 180 250 200 Z" fill="url(#cardGold)" opacity="0.8"/>
  
  <text x="250" y="320" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="url(#cardGold)" text-anchor="middle" letter-spacing="2">HAND IN HAND</text>
  <text x="250" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#E5D3BE" text-anchor="middle" opacity="0.85">Ready to walk through every chapter together</text>
  <text x="250" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#C5A059" text-anchor="middle" letter-spacing="1" opacity="0.6">TAP TO EXPAND</text>
</svg>